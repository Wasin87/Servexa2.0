    <!-- Theme Inline Script -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('kormigo_theme');
          var isDark = theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>

  <body class="bg-stone-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 font-sans antialiased selection:bg-orange-500 selection:text-white transition-colors duration-200">

    <script type="module" src="/src/main.tsx"></script>
  </body>
